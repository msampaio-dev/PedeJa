# Valores fixos do banco do compose.yaml. Nao le DB_* nem JWT_SECRET do ambiente
# de proposito: variaveis globais de outro projeto na mesma maquina acabariam
# sobrescrevendo estas.
spring.datasource.url=jdbc:postgresql://localhost:5433/pedeja
spring.datasource.username=pedeja
spring.datasource.password=pedeja

# Segredo so para desenvolvimento local. Producao exige JWT_SECRET.
app.security.jwt.secret=ZGV2LXNvbWVudGUtbG9jYWwtcGVkZWphLTEyMzQ1Njc4OTA=

app.web.cors.allowed-origins=http://localhost:5173

spring.flyway.locations=classpath:db/migration,classpath:db/devdata

app.pagamento.webhook-secret=segredo-do-webhook-so-para-desenvolvimento-local
