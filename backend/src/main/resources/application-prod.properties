spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

app.web.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

server.forward-headers-strategy=framework
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

# URL completa do broker, ex.: amqps://usuario:senha@host/vhost (CloudAMQP).
spring.rabbitmq.addresses=${RABBITMQ_URL}

# O plano free do Render da 0.1 CPU. Criar todos os beans no arranque passa do
# tempo que o health check espera (no AgendaPro, 171 s). Lazy init adia o que
# nao e usado na subida. Publicador do outbox, consumidores e declaracoes do
# RabbitMQ sao excecoes marcadas no codigo, porque precisam existir desde o inicio.
spring.main.lazy-initialization=true

# O Neon suspende o banco sozinho depois de alguns minutos ocioso e derruba as
# conexoes abertas. O pool nao deve guardar conexao que o banco ja fechou.
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=3000

# Com 0.1 CPU, consultar o outbox a cada segundo pesa. Dois segundos ainda
# parecem imediatos na tela. Quando o Render hiberna, o agendamento para junto
# e o Neon pode dormir.
app.outbox.intervalo-ms=2000
