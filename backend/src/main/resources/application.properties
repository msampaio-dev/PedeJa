spring.application.name=pedeja
spring.profiles.default=dev

server.port=${PORT:8080}

# Por padrao apenas o schema. A carga de demonstracao vive em db/devdata e entra
# pelo perfil dev ou por FLYWAY_LOCATIONS no ambiente publicado.
spring.flyway.locations=${FLYWAY_LOCATIONS:classpath:db/migration}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Colecoes lazy (itens e historico de varios pedidos) carregam em lotes de ate 50
# com um IN (...), em vez de uma consulta por pedido.
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# A autenticacao e definida no modulo auth, sem usuario temporario em memoria.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.expiration-minutes=120

springdoc.swagger-ui.path=/swagger-ui.html

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Segredo compartilhado com o gateway para assinar o webhook (HMAC).
app.pagamento.webhook-secret=${WEBHOOK_SECRET}
app.pagamento.validade-cobranca-minutos=15

# Gateway de Pix falso, para demonstracao. Uma integracao real desliga isto e
# registra outra implementacao de GatewayPagamento.
app.gateway-fake.enabled=${GATEWAY_FAKE_ENABLED:true}
app.gateway-fake.webhook-url=${GATEWAY_FAKE_WEBHOOK_URL:}
app.gateway-fake.atraso-ms=1500
app.gateway-fake.entregas-duplicadas=true
