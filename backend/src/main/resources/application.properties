spring.application.name=pedeja
spring.profiles.default=dev

server.port=${PORT:8080}

# Por padrao apenas o schema. A carga de demonstracao vive em db/devdata e entra
# pelo perfil dev ou por FLYWAY_LOCATIONS no ambiente publicado.
spring.flyway.locations=${FLYWAY_LOCATIONS:classpath:db/migration}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# A autenticacao e definida no modulo auth, sem usuario temporario em memoria.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.expiration-minutes=120

springdoc.swagger-ui.path=/swagger-ui.html

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
